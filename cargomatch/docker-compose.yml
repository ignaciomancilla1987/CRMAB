services:
  postgres:
    image: postgres:16-alpine
    container_name: cargomatch-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cargomatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargomatch_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cargomatch}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cargomatch}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cargomatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: cargomatch-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_admin_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./apps/backend-core
      dockerfile: Dockerfile
    container_name: cargomatch-backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cargomatch}:${POSTGRES_PASSWORD:-cargomatch_dev}@postgres:5432/${POSTGRES_DB:-cargomatch}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"

volumes:
  pgdata:
  redisdata:
  miniodata:
